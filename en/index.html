up to 6 at a time",src:"Eduson Academy"},{value:15,suffix:"+",text:"niches I've made learning content for",src:"from AI to history and psychology"}]},SC=[{name:"Yandex Education",what:"AI simulators for schools in Kazakhstan",caseId:"yandex",site:"https://education.yandex.ru/",style:"yandex"},{name:"Online psychology school",what:"project under NDA",caseId:"anael",style:"nda"},{name:"Eduson",what:"courses on AI and AI ecosystems",caseId:"eduson",site:"https://eduson.academy/",style:"eduson"},{name:"Russian Railways",what:"edutainment project about the BAM railway",caseId:"rzd",site:"https://www.rzd.ru/",style:"rzd"},{name:"AI Sparta",what:"AI lab",caseId:"sparta",style:"sparta"},{name:"Creative studio",what:"national edutainment series, project under NDA",caseId:"series",style:"nda"},{name:"mads",what:"creative school",caseId:"mads",site:"https://madscourses.com/",style:"mads"},{name:"Sketching school",what:"project under NDA",caseId:"sketch",style:"nda"},{name:"SKOTCH",what:"creative agency",caseId:"rzd",site:"https://scotch-agency.ru/",style:"skotch"},{name:"Project Life",what:"Istoriya Tebya media",caseId:"story",style:"life"},{name:"Bank of Russia",what:"educational content under NDA",site:"https://www.cbr.ru/",style:"cbr"},{name:"Creative media lab",what:"multimedia history and culture project under NDA",caseId:"pages",style:"nda"}],S2=[{id:"ai",label:"AI and simulators"},{id:"school",label:"Online schools and experts"},{id:"media",label:"Media and history"}],kC=["eduson","claude","yandex","sales"],bm=["AI","interior design","landscape design","SMM","law","sales","graphic design","humanities","parenthood","psychology","creative industries","marketing","history and genealogy","architecture and sketching","film","real estate","school education"],Xi=[{id:"eduson",n:"01",cat:"ai",color:"olive",headline:"An AI course after which 78.7% of students choose the PRO plan",project:"The AI course line at Eduson Academy",meta:["in-house","edtech","since May 2024"],metrics:[{v:"78.7%",label:"conversion to the AI PRO plan on a course with my content"},{v:"195",label:"learning materials, half without experts"},{v:"4.8/5",label:"is how students rate my materials"}],role:"Full-time analyst-methodologist. I lead module-by-module content development, including courses on the major AI ecosystems: we build modules as interactive simulators. I work closely with product, marketing, experts and other methodologists.",context:"Eduson is a professional online education platform, one of Russia's top 10 EdTech companies. The content team has 33 people, 19 of them methodologists. The AI line is among the revenue leaders in its cluster. Courses ship continuously, and a two-week delay shifts sales plans. Quality has to hold under tight deadlines, and what goes into each plan is decided together with the product team.",did:["With the product team, split the AI line into three difficulty levels. I built the package structure and 30–40% of the new content.","Where the topic allows, I build a module without an expert: half of my materials were made this way, including simulators, longreads, practice and capstone projects.","The course was updated before the email went out, and curators were flooded with questions. In 2 hours I built 3 pop-ups for different plans, and the announcement went out together with the update.","Brought the Landscape Designer module to completion with a difficult expert: became co-author and wrote the practice, longreads and resource library myself.","With marketing, built lead magnets for automated funnels, including a professional test."],effect:["The whole methodologist cluster adopted the mechanics from my simulators.","A professional test brought in 50+ students with no ad budget.","195 learning materials and 178 hours of content. I made half of them without an expert.","In 2025: #1 in the department by output and Employee of the Year."],link:{href:"https://eduson.academy/",label:"eduson.academy"}},{id:"yandex",n:"02",cat:"ai",color:"pink",headline:"Yandex Education's AI product adapted for schools in Kazakhstan: children aged 7–18 learn on simulators",project:"Computer vision simulators for Yandex Education",meta:["freelance in a team","school education","Kazakhstan"],metrics:[{v:"7",label:"interactive simulators"},{v:"5",label:"audiences: three school age groups, parents and teachers"},{v:"15",label:"brainstorms to rebuild the material"}],role:"Owned the creative and learning side: ideas, mechanics, guides. We worked as a team of methodologists and agreed decisions with the client.",context:"Yandex Education had a ready-made AI product that had to be adapted for schools in Kazakhstan. The main topic was computer vision: how a machine sees and recognises images. To a schoolchild it feels remote, so it had to be tied to the school curriculum and split into five audiences instead of one.",did:["Ran a series of brainstorms and found how to tie computer vision to the school curriculum: children solve problems familiar from class, so the new topic lands more easily.","We split students by age (7–10, 11–14 and 15–18) and chose a separate teaching approach for each group.","We rewrote the longreads and split the material into three formats: longreads, cards and interactive simulators with theory and tasks inside the exercises.","I wrote guides for teachers and parents: how to run a class and how to talk to a child about AI.","For each age we defined what a child should be able to do after the simulator and checked it with tasks inside the exercises rather than a test at the end."],effect:["Students leave with a concrete skill: they can explain how a machine recognises an image and use that knowledge to solve a problem from their own curriculum.","AI stopped being a separate “technology lecture”: it's built into subjects children already study.","The teacher gets a ready-made class: a guide, a simulator for the class's age and a progress map showing who has completed what.","Seven simulators cover five audiences instead of one: three school age groups, teachers and parents."],link:{href:"https://education.yandex.ru/",label:"education.yandex.ru"}},{id:"claude",n:"03",cat:"ai",color:"orange",headline:"Simulators with AI demos inside: 4–5 hours to build instead of 8–12",project:"Interactive demo simulators at Eduson Academy",meta:["in-house","team with product","2026"],metrics:[{v:"10",label:"demo simulators for Alice AI, Qwen and Shedevrum in three months"},{v:"5",label:"Claude Code skills that made work easier for the whole cluster"},{v:"4",label:"learning mechanics adopted by the whole cluster"}],role:"Methodologist working with the product team: simulator formats and mechanics, automated demo pipeline, Claude Code skills.",context:"All AI courses were written as longreads with self-checks and no interactivity. Product proposed moving to simulators on one condition: a simulator had to take about as long as a longread, while in Articulate Storyline one took 8–12 hours. The second problem was access: some AI tools are unavailable in Russia, and students refused to learn a tool they couldn't log into.",did:["Together with product we designed several simulator formats and started building them in Claude Code, an AI tool that writes code from a task description.","Automated the production pipeline for demo simulators: inside each simulator is a clickable demo of the AI tool, built entirely in Claude with no third-party services.","Built 10 such simulators for Alice AI, Qwen and Shedevrum: texts, tables, research, images and video. For Qwen, lessons for entrepreneurs: revenue analysis, product cards, social media covers.","Designed and built 5 Claude Code skills on my own. They made work easier for the whole methodologist cluster.","Added 4 learning mechanics to the simulators, such as drag-and-drop, where the student moves elements and sees a mistake right away. The cluster adopted them as best practice.","Together with the team we created internal branding and simulator benchmarks. The instructional review stayed with the methodologist: AI misses inaccurate feedback or a task where you can't go wrong."],beforeAfter:{label:"Building an interactive simulator",before:"8–12 hours",after:"4–5 hours"},effect:["Students learn to work with an AI tool even if they can't log into it from Russia: they learn the interface and scenarios by clicking through the demo inside the simulator.","The students' main objection, “I don't have access to this AI tool”, went away.","A simulator takes 4–5 hours, like a longread, thanks to the pipeline I automated and my Claude Code skills.","My 4 mechanics and 5 skills are used by every methodologist in the cluster, including in courses I have nothing to do with."]},{id:"sales",n:"05",cat:"school",color:"olive",headline:"End-to-end sales course: 86% of students actively learning in the first month",project:"End-to-end sales course “Sales: for work, career and life”",meta:["freelance","sales","full cycle"],metrics:[{v:"86%",label:"of students actively learning in the first month"},{v:"3",label:"audiences, split across lessons, modules and plans"},{v:"1",label:"original printed guidebook, built from scratch"}],role:"Project lead: full development and production cycle, client budget, contractors, team, metrics and launch on the platform.",context:"There are plenty of sales courses, and one more about “techniques” would go unnoticed. The audience varies: some need sales for work, others for their career and negotiations, others to stop being afraid to ask.",did:["Led the project: owned the client budget, deadlines and reporting. Found and assembled the contractors myself: camera operator, editor, designers.","Did the research: market, competitors, empathy map, in-depth interviews. From it, identified three audiences.","Worked with the expert to distil his own sales methodology and built the program on it.","Managed a methodologist: we made some materials together, and I wrote the lesson scripts and teaching materials.","Organised the filming and ran production: editing, video graphics with the designers, publishing on the platform.","Developed a printed sales guidebook from scratch. The methodology is mine; it's a fully original product.","Supported the cohort: built a metrics system (completion, homework, engagement, CSAT and NPS), weekly surveys, team reports and in-depth interviews with students."],effect:["The course launched fully packaged: program, lessons, guidebook, platform and ecosystem.","86% of students were actively learning in the first month; chat engagement at launch was 50%.","Students who reached the final survey rated the course 5 out of 5 and gave it an NPS of 10 out of 10.","An analytics report on the cohort showed where the course sags and gave a plan for the next launches: homework templates, a course map and a curator system.","Every student in the first cohort received a printed guidebook as a gift."],quote:{text:"Nina is an expert at what she does: systematic, brilliant, full of ideas. We built a course with her and also had her support the cohort. She's someone you can rely on.",name:"Alexander Batin",role:"head of sales in EdTech"}},{id:"sparta",n:"06",cat:"ai",color:"pink",headline:"12 of 12 participants finished the lab, and the expert no longer carries the course alone",project:"AI Sparta, an AI lab for senior professionals",meta:["freelance","AI lab","senior professionals"],metrics:[{v:"12/12",label:"of the cohort completed the program"},{v:"14 + 14",label:"workshops and lectures in the rebuilt program"},{v:"40%",label:"of the program delegated to guest specialists"}],role:"The lab's methodologist: research, program rebuild, knowledge base, briefs for guest specialists. Took the instructional and operational load off the expert.",context:"An AI lab for senior professionals was losing participants: the program was opaque, and the expert was running both content and operations alone. The course had to become clear and the expert's load lighter without losing depth.",did:["Formulated learning hypotheses and tested them in 10 interviews with participants from the previous cohort. What was missing most was clarity and simplicity.","Rebuilt the program: mapped the student journey, added practice and scripts for 14 workshops.","Put together a full course guide-summary so participants can return to any topic.","Wrote briefs for guest specialists and handed 40% of the program to them.","Designed an interactive AI handbook that the expert updates herself."],effect:["In the rebuilt cohort, 12 of 12 participants completed the program. The course's average completion rate is 75%.","The program grew to 14 workshops and 14 lectures, while the expert's workload went down.","The lab got its own ecosystem: a handbook, a guide-summary and briefs for new speakers.","The expert was freed from operations, and the knowledge base updates without the team's involvement."],quote:{text:"I'm very grateful to Nina: her feedback on the program and the lab showed me there were things that needed explaining for the format to make sense. I hadn't seen many of them myself! An outside view and opinion is pure gold!",name:"Elena Dernova",role:"founder of Looch AI and the AI Sparta lab"}},{id:"anael",n:"07",cat:"school",color:"orange",headline:"Brought order to a psychology school in three months: product line, curators, knowledge base and 4 new modules",project:"Methodology and product for an online psychology school",meta:["project under NDA","psychology","3 months"],metrics:[{v:"3 mos",label:"trial period, during which I implemented all the changes"},{v:"20",label:"lessons: 4 modules of 5 lessons, from recording to graphics"},{v:"3",label:"flagship programs got a knowledge base from scratch"}],role:"The school's methodologist with product responsibility: product line and new products, curator team, guidelines, knowledge base, module production. Connected the founder, experts, contractors and departments.",context:"The school has several flagship programs, curators, a sales team, experts and contractors. Processes ran on verbal agreements, the curator team had no rules, and new products had to launch alongside running cohorts.",did:["Held 1:1s with curators: workload, pain points, processes, how they see the students. Put the curator team in order and wrote its guidelines.","Set up how departments work together: who owns what and how tasks are handed over.","Owned the product: ran 5+ customer interviews, built the concept of an entry product and a product map of the psychology line in three tiers: entry, core and VIP.","Audited the school and the mentor program: funnel, platform, products, reasons people didn't buy.","Built a knowledge base from scratch for the supplementary materials of three flagship programs. No one had worked on this before me.","Developed 4 modules of 5 lessons each and built them into the flagship program: recording, editing, graphics, coordination with contractors.","Built AI mini-products on tight deadlines: a free marathon, a 14-lesson mini-course, guides and a handbook for the sales team."],effect:["All changes were implemented within the three-month trial period with the team.","The school got a product line with a clear student path: from the entry product to the core program and VIP.","Curators work by written guidelines, and departments have a clear map of who owns what.","Supplementary materials for three flagship programs are in one knowledge base for the first time.","The flagship program gained 4 new modules, and the sales team now speaks to the audience in the same language as the course."]},{id:"mads",n:"08",cat:"school",color:"pine",headline:"Brand Strategy course rebuilt from research data: only 10% of students attended live lectures",project:"The Brand Strategy course and instructional design support for the mads creative school course line",meta:["freelance","creative education","2024–2025"],metrics:[{v:"6",label:"hypotheses tested with quantitative and qualitative research"},{v:"10%",label:"of students attended live lectures regularly"},{v:"8",label:"guidelines and rules for the curator team"}],role:"The school's methodologist: course research from hypotheses to recommendations, curator guidelines, methodology for other courses in the line.",context:"The Brand Strategy course ran for six months. Students lost motivation, got confused about the schedule and roles, and many stopped attending lectures. The school needed to understand why and decide what to change in the course and in how curators work.",did:["Formulated 6 hypotheses, from falling motivation to overload, and tested them with a survey and in-depth interviews with students and curators.","Found in the data: only 10% of students attended live lectures regularly, 40% never attended, 66% named workload as the reason, and 30% found the volume too large.","Found the systemic causes: no clear course logic, a schedule that didn't match reality, unclear curator roles, and homework out of sync with lectures.","Proposed solutions: recorded theory with a deadline before the consultation, a kick-off meeting and random coffee for the group to get to know each other, convenient lecture times, theory moved to the start of the course and more practice.","Wrote 8 guidelines and rules for the curator team: how the team works, homework review criteria, simulations, Q&A sessions, real-call practice, reviews of students' calls and chats, the online workshop “Sales channels and tools”, and rules for how curators talk to learners.","Then led the methodology of other courses in the line: marketing, negotiation, and a creators' course with a skill set."],effect:["I handed the research and recommendations to the school. The course authors, project managers and curators implemented them in the program.","The team made course decisions based on data: 6 hypotheses, a survey and interviews instead of gut feeling.","Curators work by shared rules: it's clear who owns what, how to review assignments and how to run practice sessions."],link:{href:"https://madscourses.com/",label:"madscourses.com"}},{id:"sketch",n:"09",cat:"school",color:"olive",headline:"Sketching school audit: 5 risk zones, 4 audience personas and a repackaging strategy",project:"Audit and strategy for a sketching school",meta:["project under NDA","in a team with a methodologist","audit and strategy"],metrics:[{v:"3",label:"products in the line audited"},{v:"5",label:"risk zones found in the programs"},{v:"4",label:"audience personas with pains and motives"}],role:"Methodologist working in a pair with a colleague: program audit, audience research, recommendations and growth strategy.",context:"The school has a strong academic core: a foundation from an architecture professor with 46 years of experience, an original method and a loyal community. Yet the courses looked like a “warehouse of video lectures”, and new students came mostly through referrals.",did:["Audited three products in the line: two tiers of the core course and a composition module. For each we described its key feature and growth potential.","Identified 6 learning assets the school can grow on: its own language, methods, expert status, academic core, community and studio.","Found 5 risk zones: information isolation, disconnected modules, hidden barriers, blurred positioning and opaque timing.","Built 4 audience personas, from practising architects to creative seekers, with their pains, needs and motives, plus a map of the student's transformation on the course.","Proposed a strategy: simplify and restructure the programs, digitise the founder's method, make timing and outcomes concrete, build a community and move to a convenient platform."],effect:["The founders got a growth map: what to change in the courses and how to attract students beyond word of mouth.","The founders took the strategy in-house, but by their decision the project was not implemented."]},{id:"rzd",n:"10",cat:"media",color:"pink",headline:"Young people read the history of the BAM railway: +30% followers aged 18–25 in four months",project:"Edutainment project about the Baikal–Amur Mainline for Russian Railways",meta:["SKOTCH agency","history","March 2022 — March 2024"],metrics:[{v:"+30%",label:"share of followers aged 18–25 in four months"},{v:"500+",label:"unique pieces on VK and Odnoklassniki"},{v:"4 000+",label:"people viewed and engaged with the content"}],role:"Learning concept, research, strategy and team coordination.",context:"For the 50th anniversary of the BAM railway, Russian Railways launched BAM-50, a documentary history and culture project about the line and the people who built it. To anyone under 25, BAM sounds like a paragraph from a textbook, and on social media entertainment pages compete for their attention.",did:["Ran in-depth interviews, analysed competitors and archive materials.","Shifted the focus from heroics to everyday life: how the builders lived, what they ate, what songs they sang, what stories went round the carriages.","Built the concept at the intersection of research and storytelling, and set out the project's tone as an instructional foundation for the media.","Coordinated copy, scripts, photo archives and work with TASS."],effect:["The project's audience got younger: the share of followers aged 18–25 grew by 30% in four months.","The outlet got a foundation for long-term growth: a tone and presentation principles.","The project lives on: the BAM-50 portal has more than 305,000 unique users, and visitors have added more than 2,700 builders' biographies to the archive."],link:{href:"https://bam50.ru/",label:"bam50.ru"}},{id:"story",n:"11",cat:"media",color:"orange",headline:"A cross-media product for a family history book: 46 pieces, 10+ speakers and an editorial policy from scratch",project:"Istoriya Tebya media for Project Life",meta:["in-house","history and genealogy","January 2021 — February 2022"],metrics:[{v:"46",label:"pieces published in the media"},{v:"10+",label:"speakers: historians and genealogists"},{v:"4",label:"people on the team I led"}],role:"Editor-in-chief: concept, editorial policy, team and speakers. For a while I ran all the content myself.",context:"Project Life helps people restore their family history and publishes a book about it. The company needed a media outlet that continues the book and also works as a product of its own.",did:["Came up with a cross-media product: the media outlet complements the book and lives on its own across several platforms.","Researched the topic, built the site and section structure, wrote the editorial policy: mission, tone, presentation rules and fact-checking.","Brought in more than 10 speakers, historians and genealogists, and set up how we worked with them.","Built a production system the company used to save money and cut content development budgets.","Led a team of 4, and for a while ran all of the outlet's content myself.","Handled media support for the Gentech festival of genealogy and family history and gave a talk at the Krasnoyarsk Summer School as the outlet's editor-in-chief."],effect:["The outlet reached a steady publishing pace: 46 pieces in the feed.","Content cost the company less thanks to my production system.","The company still uses the editorial policy and strategy after I left."],link:{href:"https://xn--90ahia3amfid3kd.xn--p1ai/media",label:"историятебя.рф"}},{id:"series",n:"12",cat:"media",color:"pine",headline:"From archives to scripts: research and facts for a national edutainment series",project:"A creative studio's national edutainment series",meta:["project under NDA","history","December 2020 — July 2021"],metrics:[],role:"Project researcher: owned the research, archives and factual accuracy for the studio's series, books and booklets.",context:"The series tells history to a broad national audience. Millions would notice a factual error, so every fact had to be accurate and the delivery clear to viewers without a history background.",did:["Gathered the research and facts the series' scripts were built on.","Turned complex research into stories a mass audience could follow.","Worked with archive sources for the studio's books and booklets: searched, organised and checked every fact.","Formulated the principles for selecting material for script formats, which the studio used to decide what goes into an episode."],effect:["The studio's scripts, books and booklets rely on verified sources.","Scriptwriters got ready-made facts and didn't spend time searching and checking.","Material was selected for formats by clear rules rather than taste."]},{id:"pages",n:"13",cat:"media",color:"olive",headline:"7 Red Dot awards and Epica Awards gold for a multimedia history and culture project",project:"A creative media lab's multimedia history and culture project",meta:["project under NDA","history and archives","January — July 2020"],metrics:[{v:"5",label:"platforms: Twitter, Instagram, Facebook, VK, YouTube"},{v:"7",label:"Red Dot Design Awards, two of them the top prize"},{v:"6 mos",label:"ran the project's Twitter"}],role:"Junior producer of educational projects on the studio team: research, data verification, scripts, running Twitter.",context:"The project told history to a young audience in the language of modern media: archive documents and personal memories were adapted for five social networks, each with its own format. There were thousands of posts, and every fact had to be checked.",did:["Set up the archive workflow and verified data before publication.","Ran the project's Twitter for six months: built a historical chronicle as posts from eyewitnesses.","Wrote YouTube video scripts, including from foreign archives.","Came up with interactive formats for videos and built storytelling on documents and personal stories.","Researched subject areas and interviewed experts.","Prepared fact-checked material for the illustrators, motion designers and design school students who made the project's graphics."],effect:["The project won 7 Red Dot Design Awards, two of them the top prize.","Epica Awards gold in Social Networks and a Cannes Lions shortlist in Digital Craft for multi-platform storytelling.","Two Clio Entertainment bronzes for social content and a Cresta Awards silver for innovative use of social media.","Audience engagement was twice the KPI."]}],Rm={CustDev:"I talk to future students before I start building the course. I find out what they actually need so I don't teach anything extra.","Student CJM":"A map of how a person moves through the course, from the first click to the last lesson. It shows where they get bored or stuck and where they might drop out.","Backward Design":"I plan a course backwards. First I decide what a person should be able to do after the training, then I choose the lessons that lead there.",ADDIE:"A step-by-step plan for building a course: study the task, design, develop, launch, evaluate. Nothing gets lost along the way.","4C/ID":"A way to teach complex skills on real tasks. People solve real-life problems from the start, from simple to complex, and get theory when they need it.","Bloom's taxonomy":"A ladder of learning goals, from “remember” to “create your own”. It shows what to expect from a student and which tasks to give them.",andragogy:"The science of how adults learn. Adults need to understand why they're learning something and apply it right away.","skill map":"A map of skills by level: what a person can do at the start, in the middle and at the end. The program is built from it, and learning is checked against it.","synchronous courses":"Everyone learns together at the same time: live webinars, calls, a shared chat with a curator. Works when immediate feedback and group support matter.","asynchronous courses":"Everyone takes the course at their own pace: recorded lessons, tasks and checks are available any time. This suits busy adults, and the course scales easily to thousands of students.","dialogue simulators":"A chat with a character where the student chooses what to reply. They practise a conversation with a client, a prompt to an AI tool or a difficult situation at work and immediately see where their choice leads.","learning bots":"A messenger assistant that guides the student through the course. It sends tasks, reminds them of deadlines, answers common questions and takes some of the load off curators.","learning metrics":"Numbers that show whether a course works. I look at how many people finished, where they dropped out, how they rated lessons and whether they managed the practice, and use them to decide what to fix.","Kirkpatrick model":"A way to check whether a course worked. I look at four things: did they like it, did they remember it, do they apply it at work, and does it benefit the business."},Ql={statement:"First I find out why a person came to the course. Everything else depends on the answer: the program, the formats and how I'll check the result.",steps:[{verb:"I research",items:["competitor analysis","CustDev","in-depth interviews","Student CJM","qualitative research","quantitative research"]},{verb:"I design",items:["whole programs","skill map","Backward Design","ADDIE","4C/ID","Bloom's taxonomy","andragogy"]},{verb:"I build",items:["synchronous courses","asynchronous courses","mini-courses","interactive longreads","dialogue simulators","learning games","quizzes and tests","capstone projects","custom platforms","AI assistants","learning bots"]},{verb:"I measure",items:["Kirkpatrick model","completion rate","ratings","engagement","learning metrics"]}],tools:["Claude Code","Claude","ChatGPT","Gemini","Nano Banana","NotebookLM","Manus","n8n","Figma","FigJam/Miro","Notion","Canva","Tilda","GetCourse","iSpring","Articulate Storyline","LMS"]},PC="I work in-house and take on projects: whole or in parts, one-off or long-term. I quote a price after a call, once the scope and timeline are clear.",ks=[{name:"A methodologist for your team",text:"Available for full-time, part-time or project work. I take on the methodology of a course line, the experts and course production.",includes:["full cycle: from the program to building it on the platform","working with experts and contractors","metrics: completion, ratings, conversion"],time:"in-house or project"},{name:"Consultation",text:"A call where we go through your product, program or methodology. Good if the question can be solved in a couple of hours.",includes:["review of a course, program or idea","answers to the team's questions","a list of next steps"],time:"1.5–2 hours"},{name:"Instructional design audit",text:"I look at how learning in the course is built, where students get lost and what competitors do.",includes:["student journey and where they drop out","logic of the program and tasks","comparison with competitors","a prioritised list of fixes"],time:"1–2 weeks"},{name:"Program and skill map",text:"I design the whole program, from the skill map to tasks and assessment. That's how I built a three-level competency map and module outcomes for the mads creators' course.",includes:["skill map: skills by level","learning outcomes by module","tasks and assessment","Briefs for speakers and experts"],time:"by output"},{name:"Rebuilding existing content",text:"Have lectures, webinars or an old course? I'll rebuild them into a new product without reshoots, faster and cheaper than starting from scratch.",includes:["audit of what already exists","new structure and student journey","practice and tasks on top of recordings","summaries and longreads"],time:"cheaper than from scratch"},{name:"Simulators, games and bots",text:"I build the interactive parts myself in Claude Code, without waiting in a developer's queue.",includes:["dialogue simulators","learning games and quizzes","bots and AI assistants"],time:"from 4 hours per simulator"},{name:"Course from scratch",text:"I build the course together with a team of methodologists and contractors, from research to the first cohort.",includes:["market and audience research","program, scripts, materials","filming, editing, platform","support for the first cohort"],time:"from 3 months"},{name:"Something else",text:"Describe your situation in a message, and I'll suggest a format for the task.",includes:[],time:"let's discuss"}],EC=[{text:"Nina is an expert at what she does: systematic, brilliant, full of ideas. We built a course with her and also had her support the cohort. She's someone you can rely on. Thank you so much for working together! I'll come back myself and recommend her to others.",name:"Alexander Batin",role:"head of sales in EdTech"},{text:"I'm very grateful to Nina: her feedback on the program and the lab showed me there were things that needed explaining for the format to make sense. I hadn't seen many of them myself! An outside view and opinion is pure gold!",name:"Elena Dernova",role:"creative director, founder of Looch AI and the AI Sparta lab"},{text:"The program is full of useful content and creativity. Nina has both structure and taste, so learning from a program like this is genuinely interesting.",name:"Senior Learning Experience Designer",role:"EdTech project under NDA"}],Bn={hello:"Nice to meet you!",p1:"My name is Nina. Since 2020 I've been making learning projects: first in creative studios and media, now in EdTech.",p2:"To me, a course is a product with a user who has a job to get done.",p3Before:"I'm a historian by education, a graduate of HSE University, and that turned out to be unexpectedly useful in instructional design. Academia taught me to sort through piles of scattered sources and build ",p3Mark:"coherent",p3After:" learning material.",path:[{years:"2020–2021",title:"Joining educational production",text:["From January to July 2020, at a creative media lab, I research subject areas, interview experts and turn raw material into structure for edutainment videos. I set up the archive workflow for a multimedia history and culture project, run its Twitter for six months and write YouTube video scripts. The project won 7 Red Dot awards and Epica gold.","From December 2020 to July 2021, at a creative studio, I gather research and facts for a national edutainment series."]},{years:"2021–2022",title:"Launching a media outlet from scratch",text:["From January 2021 to February 2022, at Project Life, I launch Istoriya Tebya, a family history media outlet: research, structure, mission and tone. I lead a team of 4, and we publish 46 pieces with 10+ speakers."]},{years:"2022–2024",title:"Combining creativity and education",text:["From March 2022 to March 2024, at the SKOTCH agency, I build educational special projects for Russian Railways and the Bank of Russia. I intern at two agencies and win junior D&AD and Young Lions awards.","I complete the Methodologist Program and Designing Digital Learning Products at RUDN University and move fully into instructional design."]},{years:"2024–2025",title:"I work with large clients and mass courses",text:["In May 2024 I joined Eduson Academy to build courses on AI, marketing and design. In 2025 I ranked #1 in the department by output and was named Employee of the Year. My materials are rated 4.8 on average.","I take part in research on AI avatars and, together with colleagues, build them into course production.","Since February 2024 I also freelance: simulators for Yandex Education, methodology for the mads school, the AI Sparta lab, end-to-end courses for independent experts."]},{years:"2026",title:"Upskilling in product and AI",text:["I lead module-by-module content development at Eduson, including courses on the major AI ecosystems. Together with product, we moved the AI courses from longreads to simulators: a simulator now takes 4–5 hours, like a longread, instead of 8–12. The whole methodologist cluster adopted my 4 mechanics, and the 5 Claude Code skills I built made work easier for everyone in it.","I'm studying product development: testing hypotheses, running research and working with metrics. I apply it to courses straight away, from CustDev to completion analysis.","I take on new formats and niches: mini-courses on Alice AI and Qwen, skill maps, programs on architecture, sketching, psychology and film."]}]},Dm={title:"Let's work together",text:"Tell me about your task or invite me to your team. I'll tell you whether I can help and in what format."},Om={title:"What happens after your message",steps:[{lead:"You write.",text:"On Telegram or by email: what you need and by when. The task buttons above copy the start of the message."},{lead:"We have a call.",text:"We go through the task and what you already have, and discuss timeline and budget."},{lead:"I send a proposal.",text:"A deck with stages, timeline and cost. Easy to forward to your manager."},{lead:"We agree.",text:"We discuss the proposal and adjust the timeline and scope if needed. We start when both sides are happy."},{lead:"We work in stages.",text:"After each stage I show the result and collect feedback. If something changes, we discuss right away how it affects the timeline."}]},TC=[{label:"Methodologist for the team",text:"Hi Nina! We're looking for a methodologist to join our team: "},{label:"Consultation",text:"Hi Nina! I'd like a consultation: "},{label:"Course audit",text:"Hi Nina! I'd like an instructional design audit of a course: "},{label:"Program or skill map",text:"Hi Nina! We need a program or a skill map: "},{label:"Course rebuild",text:"Hi Nina! I'd like to rebuild existing content: "},{label:"Simulator, game or bot",text:"Hi Nina! We need something interactive: "},{label:"Course from scratch",text:"Hi Nina! I'd like to build a course from scratch: "},{label:"Other",text:"Hi Nina! Here's my task: "}],lt={kicker:"Educational Program Methodologist",name:"Nina Volkova",format:"Remote or hybrid · full-time, part-time or project work",summary:"Online course methodologist with a product mindset. 6+ years in education projects, including 2.5 years at Eduson, a top-10 Russian EdTech platform. Made 740+ learning and media materials: mass asynchronous courses, interactive simulators, corporate special projects and end-to-end courses for experts. On average, 75% of learners finish my courses. I start from the learner's goal and data, lead teams of methodologists, experts and contractors, and build simulators in Claude Code in 4–5 hours instead of 8–12.",stats:[{v:"75%",t:"of learners finish my courses on average"},{v:"195",t:"learning materials and 178 hours of content at Eduson"},{v:"4.8/5",t:"is how students rate my materials"},{v:"#1",t:"in the department by output, Eduson, 2025"}],expTitle:"Experience · 6 years 6 months",jobs:[{title:"Analyst-Methodologist",org:"Eduson Academy",when:"May 2024 — present",long:"2 yrs 6 mos",sub:"Top-10 EdTech in Russia · asynchronous courses for reskilling and upskilling · eduson.academy",text:"I lead module-by-module content development for the AI line, including courses on the major AI ecosystems. The line is among the revenue leaders in its cluster. The content team has 33 people, 19 of them methodologists.",bullets:["Shipped 195 learning materials and 178 hours of content, half of it without an expert.","In 2025, ranked #1 in the department by output and was named Employee of the Year.","Keep an average material rating of 4.8/5.","Together with product, moved the AI courses from longreads to simulators: a simulator now takes 4–5 hours instead of 8–12. Built 10 demo simulators for Alice AI, Qwen and Shedevrum.","Built 5 Claude Code skills and introduced 4 learning mechanics. The whole methodologist cluster uses them.","Created the content of a course after which 78.7% of students choose the PRO plan.","A professional test as a lead magnet brought in 50+ students with no ad budget.","Managed 20+ experts, up to 6 at a time."],stack:"Claude Code, Claude, ChatGPT, NotebookLM, Articulate Storyline, Figma, Notion"},{title:"Methodologist & Product Specialist",org:"freelance",when:"February 2024 — present",long:"2 yrs 9 mos",sub:"EdTech companies, online schools and independent experts",text:"I take on end-to-end projects: courses from scratch, instructional design audits, program rebuilds and consultations. I assemble and lead teams of instructional designers and contractors.",bullets:["Yandex Education: as part of a team, adapted an AI product for schools in Kazakhstan, with 7 interactive simulators for 5 audiences. I was responsible for mechanics and guides for teachers and parents.","End-to-end course “Sales: for work, career and life” as project lead: budget, contractors, a methodologist on the team, research, program, filming, an original guidebook. 86% of students were actively learning in the first month.","AI Sparta lab: rebuilt the program and knowledge base. 12 of 12 participants finished, and 40% of the program was handed to guest speakers.","Online psychology school (NDA): in 3 months, a product line, curator guidelines, a knowledge base for 3 flagship programs, 4 new modules of 5 lessons each.","mads creative school: research on the Brand Strategy course (6 hypotheses, a survey and interviews) and 8 guidelines for the curator team.","Sketching school (NDA): together with a fellow methodologist, audited 3 products and built a repackaging strategy."],stack:"Claude Code, Claude, ChatGPT, Manus, NotebookLM, Figma, Notion"},{title:"Educational Projects Creator",org:"SKOTCH agency",when:"March 2022 — March 2024",long:"2 yrs 1 mo",sub:"Creative agency · learning and media projects for corporate clients",text:"Built educational special projects for Russian Railways and the Bank of Russia: concept, research, strategy, team coordination.",bullets:["Edutainment project about the BAM railway for Russian Railways: 500+ pieces on VK and Odnoklassniki, 4,000+ people engaged with the content.","The share of followers aged 18–25 grew by 30% in 4 months.","Ran in-depth interviews and a competitor analysis, and set out the project's tone as an instructional foundation for the media.","Coordinated copy, s
