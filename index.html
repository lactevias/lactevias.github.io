он»"},{value:15,suffix:"+",text:"ниш, для которых я делала образовательный контент",src:"от нейросетей до истории и психологии"}]},kC=[{name:"«Яндекс Образование»",what:"тренажёры по ИИ для школ Казахстана",caseId:"yandex",site:"https://education.yandex.ru/",style:"yandex"},{name:"Онлайн-школа психологии",what:"проект под NDA",caseId:"anael",style:"nda"},{name:"«Эдюсон»",what:"курсы по нейросетям и ИИ-экосистемам",caseId:"eduson",site:"https://eduson.academy/",style:"eduson"},{name:"«РЖД»",what:"edutainment-проект о БАМе",caseId:"rzd",site:"https://www.rzd.ru/",style:"rzd"},{name:"AI Sparta",what:"лаборатория по нейросетям",caseId:"sparta",style:"sparta"},{name:"Креативная студия",what:"федеральный edutainment-сериал, проект под NDA",caseId:"series",style:"nda"},{name:"mads",what:"креативная школа",caseId:"mads",site:"https://madscourses.com/",style:"mads"},{name:"Школа авторского скетчинга",what:"проект под NDA",caseId:"sketch",style:"nda"},{name:"«СКОТЧ»",what:"креативное агентство",caseId:"rzd",site:"https://scotch-agency.ru/",style:"skotch"},{name:"«Проект Жизнь»",what:"медиа «История тебя»",caseId:"story",style:"life"},{name:"«Банк России»",what:"образовательный контент под NDA",site:"https://www.cbr.ru/",style:"cbr"},{name:"Креативная медиалаборатория",what:"мультимедийный историко-культурный проект под NDA",caseId:"pages",style:"nda"}],k2=[{id:"ai",label:"ИИ и тренажёры"},{id:"school",label:"Онлайн-школы и эксперты"},{id:"media",label:"Медиа и история"}],PC=["eduson","claude","yandex","sales"],Rm=["нейросети","дизайн интерьеров","ландшафтный дизайн","SMM","юриспруденция","продажи","графический дизайн","гуманитарные науки","материнство","психология","креативные индустрии","маркетинг","история и генеалогия","архитектура и скетчинг","кино","недвижимость","школьное образование"],Xi=[{id:"eduson",n:"01",cat:"ai",color:"olive",headline:"Курс по нейросетям, после которого 78,7% студентов выбирают тариф «ПРО»",project:"Линейка курсов по нейросетям в Академии «Эдюсон»",meta:["в штате","edtech","с мая 2024 года"],metrics:[{v:"78,7%",label:"конверсия в тариф «Нейросети ПРО» на курсе с моим контентом"},{v:"195",label:"учебных материалов, половина — без привлечения экспертов"},{v:"4,8/5",label:"так студенты оценивают мои материалы"}],role:"Аналитик-методолог в штате. Лидирую помодульную разработку контента, в том числе по ведущим ИИ-экосистемам: модули собираем через интерактивные тренажёры. Работаю в связке с продуктом, маркетингом, экспертами и другими методологами.",context:"«Эдюсон» — платформа профессионального онлайн-образования из топ-10 EdTech России. В команде контента 33 человека, из них 19 методологов. Линейка «Нейросети» — среди лидеров по выручке в своём кластере. Курсы выходят потоком, и задержка на две недели сдвигает планы продаж. Качество нужно держать в жёстких сроках и вместе с продуктовой командой решать, что войдёт в тарифы.",did:["С продуктовой командой развели линейку «Нейросети» на три уровня сложности. Я собрала структуру пакетов и 30–40% нового контента.","Где тема позволяет, делаю модуль без эксперта: так сделана половина моих материалов — тренажёры, лонгриды, практика и дипломные проекты.","Курс обновили раньше, чем ушла рассылка, и кураторам посыпались вопросы. За 2 часа собрала 3 поп-апа под разные тарифы — анонс вышел вместе с обновлением.","Довела до финала модуль «Ландшафтного дизайнера» со сложным экспертом: стала соавтором, сама написала практику, лонгриды и библиотеку материалов.","С маркетингом сделала лид-магниты для автоворонок, в том числе профессиональный тест."],effect:["Механики из моих тренажёров взял весь кластер методологов.","Профессиональный тест привёл 50+ студентов без бюджета на рекламу.","195 учебных материалов и 178 часов контента. Половину из них я сделала без эксперта.","В 2025 году — первое место в отделе по объёму выпуска и звание сотрудника года."],link:{href:"https://eduson.academy/",label:"eduson.academy"}},{id:"yandex",n:"02",cat:"ai",color:"pink",headline:"Продукт «Яндекс Образования» про ИИ адаптировали для школ Казахстана: дети 7–18 лет учатся на тренажёрах",project:"Тренажёры по компьютерному зрению для «Яндекс Образования»",meta:["фриланс в команде","школьное образование","Казахстан"],metrics:[{v:"7",label:"интерактивных тренажёров"},{v:"5",label:"аудиторий: три возраста школьников, родители и учителя"},{v:"15",label:"брейнштормов, чтобы пересобрать материал"}],role:"Отвечала за креативную и образовательную часть: идеи, механики, методички. Работали командой методологов, решения согласовывали с заказчиком.",context:"У «Яндекс Образования» был готовый продукт про ИИ, и его нужно было адаптировать для школ Казахстана. Главная тема — компьютерное зрение: как машина видит и распознаёт изображения. Школьнику она кажется далёкой, поэтому её нужно было связать со школьной программой и развести на пять аудиторий вместо одной.",did:["Провели серию брейнштормов и нашли, как привязать компьютерное зрение к школьной программе: дети решают знакомые по урокам задачи, и новая тема заходит легче.","Разделили школьников по возрасту — 7–10, 11–14 и 15–18 лет — и для каждой группы выбрали свой педагогический подход.","Переписали лонгриды и разложили материал на три формата: лонгриды, карточки и интерактивные тренажёры с теорией и задачами внутри упражнений.","Я написала методички для учителей и родителей: как вести занятие и как говорить с ребёнком про ИИ.","Для каждого возраста сформулировали, что ребёнок должен уметь после тренажёра, и проверяли это заданиями внутри упражнений, а не тестом в конце."],effect:["Школьник выходит с конкретным навыком: может объяснить, как машина распознаёт изображение, и решить с этим знанием задачу из своей школьной программы.","Тема ИИ перестала быть отдельной «лекцией про технологии»: она встроена в предметы, которые дети и так проходят.","Учитель получает готовое занятие: методичку, тренажёр под возраст класса и карту прогресса, по которой видно, кто что прошёл.","Семь тренажёров закрывают пять аудиторий вместо одной: три возраста школьников, учителей и родителей."],link:{href:"https://education.yandex.ru/",label:"education.yandex.ru"}},{id:"claude",n:"03",cat:"ai",color:"orange",headline:"Тренажёры с демо нейросетей внутри: сборка за 4–5 часов вместо 8–12",project:"Интерактивные демо-тренажёры в Академии «Эдюсон»",meta:["в штате","команда с продуктом","2026"],metrics:[{v:"10",label:"демо-тренажёров по «Алисе AI», Qwen и «Шедевруму» за три месяца"},{v:"5",label:"скиллов для Claude Code, которые упростили работу всего кластера"},{v:"4",label:"образовательные механики, которые взял весь кластер"}],role:"Методолог в связке с продуктовой командой: форматы и механики тренажёров, автоматизация пайплайна демо, скиллы для Claude Code.",context:"Все курсы по нейросетям были написаны лонгридами с самопроверкой, без интерактива. Продукт предложил перейти на тренажёры с условием: тренажёр должен делаться примерно за то же время, что и лонгрид, а в Articulate Storyline на один уходило 8–12 часов. Вторая проблема — доступ: часть нейросетей недоступна в России, и студенты отказывались учиться на инструменте, в который не могут зайти.",did:["Вместе с продуктом разработали несколько форматов тренажёров и стали собирать их в Claude Code — ИИ-инструменте, который пишет код по описанию задачи.","Автоматизировала пайплайн производства демо-тренажёров: внутри тренажёра — кликабельная демо-версия нейросети, собранная только в Claude, без сторонних сервисов.","Собрала 10 таких тренажёров по «Алисе AI», Qwen и «Шедевруму»: тексты, таблицы, исследования, изображения и видео. Для Qwen — уроки для предпринимателей: разбор выручки, карточки товаров, обложки для соцсетей.","Самостоятельно разработала и собрала 5 скиллов для Claude Code. Они упростили работу всего кластера методологов.","Внедрила в тренажёры 4 образовательные механики, например drag-n-drop, где студент перетаскивает элементы и сразу видит ошибку. Кластер принял их как лучшие практики.","Вместе с командой сделали внутренний брендинг и бенчмарки тренажёров. Методическую проверку оставили за методологом: нейросеть не замечает неточную обратную связь или задание, в котором нельзя ошибиться."],beforeAfter:{label:"Сборка интерактивного тренажёра",before:"8–12 часов",after:"4–5 часов"},effect:["Студент учится работать с нейросетью, даже если не может зайти в неё из России: интерфейс и сценарии он осваивает прокликиванием демо внутри тренажёра.","Ушло главное возражение студентов «у меня нет доступа к этой нейросети».","Тренажёр собирается за 4–5 часов, как лонгрид: по пайплайну, который я автоматизировала, и с моими скиллами для Claude Code.","Мои 4 механики и 5 скиллов используют все методологи кластера, в том числе в курсах, к которым я не имею отношения."]},{id:"sales",n:"05",cat:"school",color:"olive",headline:"Курс по продажам под ключ: 86% студентов активно учились в первый месяц",project:"Курс «Продажи: для работы, карьеры и жизни» под ключ",meta:["фриланс","продажи","полный цикл"],metrics:[{v:"86%",label:"студентов активно учились в первый месяц"},{v:"3",label:"аудитории, разведённые по урокам, модулям и тарифам"},{v:"1",label:"авторский печатный гайдбук, разработанный с нуля"}],role:"Лид проекта: полный цикл разработки и производства, клиентский бюджет, подрядчики, команда, метрики и запуск на платформе.",context:"Курсов по продажам много, и ещё один «про техники» никто бы не заметил. Аудитория разная: одним продажи нужны для работы, другим — для карьеры и переговоров, третьим — чтобы перестать бояться просить.",did:["Вела проект как лид: отвечала за клиентский бюджет, сроки и отчётность. Сама нашла и собрала подрядчиков — оператора, монтажёра, дизайнеров.","Провела исследование: рынок, конкуренты, карта эмпатии, глубинные интервью. По ним выделила три аудитории.","Вместе с экспертом выкристаллизовала его авторскую методологию продаж и собрала на ней программу.","Руководила методистом: часть материалов делали вместе, сценарии уроков и методические материалы написала я.","Организовала съёмки и вела производство: монтаж, графика для видео вместе с дизайнерами, размещение на платформе.","С нуля разработала печатный гайдбук по продажам. Методология — моя, это полностью авторский продукт.","Вела сопровождение потока: собрала систему метрик — доходимость, домашние задания, вовлечённость, CSAT и NPS, — еженедельные опросы, отчёты для команды и глубинные интервью со студентами."],effect:["Курс вышел полностью упакованным: программа, уроки, гайдбук, платформа и экосистема.","86% студентов активно учились в первый месяц, вовлечённость в чате на старте — 50%.","Студенты, которые дошли до финального опроса, оценили курс на 5 из 5 и поставили NPS 10 из 10.","Аналитический отчёт по потоку показал, где курс проседает, и дал план для следующих запусков: шаблоны домашних заданий, карту курса и систему кураторов.","Каждый студент первого потока получил в подарок печатный гайдбук."],quote:{text:"Нина — специалист своего дела, системная, крутая, идейная. Делали вместе с ней курс, брали также сопровождение на потоке — это специалист, на которого можно положиться.",name:"Александр Батин",role:"руководитель отдела продаж в EdTech"}},{id:"sparta",n:"06",cat:"ai",color:"pink",headline:"12 из 12 участников дошли до конца лаборатории, а эксперт больше не держит курс на себе",project:"Лаборатория по нейросетям для senior-специалистов AI Sparta",meta:["фриланс","ИИ-лаборатория","специалисты senior"],metrics:[{v:"12/12",label:"участников потока прошли программу до конца"},{v:"14 + 14",label:"воркшопов и лекций в пересобранной программе"},{v:"40%",label:"программы делегировали приглашённым специалистам"}],role:"Методолог лаборатории: исследование, пересборка программы, база знаний, брифы для приглашённых специалистов. Сняла с эксперта методическую и операционную нагрузку.",context:"Лаборатория по нейросетям для специалистов senior-уровня теряла участников: программа была непрозрачной, а эксперт одна вела и контент, и операционку. Нужно было сделать курс понятным и снять с эксперта нагрузку, не потеряв глубину.",did:["Сформулировала образовательные гипотезы и проверила их на 10 интервью с участниками прошлого потока. Главное, чего не хватало, — чёткости и простоты.","Пересобрала программу: прописала путь студента, добавила практику и сценарии для 14 воркшопов.","Собрала полный гайд-конспект по курсу, чтобы участник мог вернуться к любой теме.","Написала брифы для приглашённых специалистов и передала им 40% программы.","Спроектировала интерактивный справочник по нейросетям, который эксперт обновляет сама."],effect:["В пересобранном потоке 12 из 12 участников прошли программу до конца. Средняя доходимость курса — 75%.","Программа выросла до 14 воркшопов и 14 лекций, и при этом нагрузка на эксперта снизилась.","У лаборатории появилась своя экосистема: справочник, гайд-конспект и брифы для новых спикеров.","Эксперт освободилась от операционки, а база знаний обновляется без участия команды."],quote:{text:"Я очень благодарна Нине — её фидбек на программу и лабораторию как раз дал понимание, что есть вещи, которые нужно раскрыть для понимания формата. Многие вещи я сама не увидела! Так что взгляд и мнение человека вне — золото просто!",name:"Елена Дернова",role:"основатель Looch AI и лаборатории AI Sparta"}},{id:"anael",n:"07",cat:"school",color:"orange",headline:"За три месяца навела порядок в школе психологии: продуктовая линейка, кураторы, база знаний и 4 новых модуля",project:"Методология и продукт для онлайн-школы психологии",meta:["проект под NDA","психология","3 месяца"],metrics:[{v:"3 мес.",label:"испытательного срока, за которые внедрила все изменения"},{v:"20",label:"уроков: 4 модуля по 5 уроков от записи до графики"},{v:"3",label:"флагманские программы получили базу знаний с нуля"}],role:"Методолог школы с продуктовой ответственностью: продуктовая линейка и новые продукты, кураторский отдел, регламенты, база знаний, производство модулей. Связывала основательницу, экспертов, подрядчиков и отделы.",context:"В школе несколько флагманских программ, кураторы, отдел продаж, эксперты и подрядчики. Процессы держались на устных договорённостях, кураторский отдел работал без правил, а новые продукты нужно было выпускать параллельно с текущими потоками.",did:["Провела 1:1 встречи с кураторами: загрузка, боли, процессы, взгляд на студентов. Навела порядок в кураторском отделе и написала для него регламенты.","Выстроила систему взаимодействия между отделами: кто за что отвечает и как передаются задачи.","Отвечала за продукт: провела 5+ кастдевов, собрала концепт входного продукта и продуктовую карту психологической линейки из трёх ступеней — входной, основной и VIP.","Провела аудит школы и программы менторов: воронка, платформа, продукты, причины, по которым не покупали.","Создала с нуля базу знаний по дополнительным материалам трёх флагманских программ. До меня этой задачей никто не занимался.","Разработала 4 модуля по 5 уроков и встроила их в флагманскую программу: запись, монтаж, графика, координация с подрядчиками.","Делала мини-продукты с ИИ в сжатые сроки: бесплатный марафон, мини-курс на 14 уроков, методички и справочник для отдела продаж."],effect:["Все изменения внедрены за три тестовых месяца работы в команде.","У школы появилась продуктовая линейка с понятным путём студента: от входного продукта к основной программе и VIP.","Кураторы работают по регламентам, у отделов есть понятная схема, кто за что отвечает.","Дополнительные материалы трёх флагманов впервые собраны в одной базе знаний.","Флагманская программа пополнилась 4 новыми модулями, а отдел продаж говорит с аудиторией на одном языке с курсом."]},{id:"mads",n:"08",cat:"school",color:"pine",headline:"Курс «Бренд-стратегия» пересобран по данным исследования: только 10% студентов ходили на онлайн-лекции",project:"Курс «Бренд-стратегия» и методологическая поддержка линейки креативной школы mads",meta:["фриланс","креативное образование","2024–2025"],metrics:[{v:"6",label:"гипотез проверила количественным и качественным исследованием"},{v:"10%",label:"студентов регулярно ходили на онлайн-лекции"},{v:"8",label:"регламентов и правил для отдела кураторов"}],role:"Методолог школы: исследование курса от гипотез до рекомендаций, регламенты для кураторов, методология других курсов линейки.",context:"Курс «Бренд-стратегия» длился полгода. Студенты теряли мотивацию, путались в расписании и ролях, многие переставали ходить на лекции. Школе нужно было понять причины и решить, что менять в курсе и в работе кураторов.",did:["Сформулировала 6 гипотез — от падения мотивации до перегруза — и проверила их анкетой и глубинными интервью со студентами и кураторами.","Выяснила по данным: только 10% студентов регулярно ходили на онлайн-лекции, 40% не ходили совсем, 66% называли причиной нагрузку, а 30% считали объём слишком большим.","Нашла системные причины: нет ясной логики курса, расписание расходится с реальностью, роли кураторов непонятны, сетка домашних заданий и лекций рассинхронизирована.","Предложила решения: теорию — в записи с дедлайном до консультации, установочную встречу и random coffee для знакомства группы, удобное время лекций, перенос теории в начало курса и больше практики.","Написала 8 регламентов и правил для отдела кураторов: как работает отдел, критерии проверки домашних заданий, симуляции, сессии «Вопрос-ответ», практика реальных звонков, разбор звонков и переписок студентов, онлайн-воркшоп «Каналы и инструменты продаж», правила общения кураторов с учениками.","Дальше вела методологию других курсов линейки: маркетинг, переговоры, курс креаторов со скиллсетом."],effect:["Исследование и рекомендации я передала школе. Внедряли их внутри программы авторы курса, проджект-менеджеры и кураторы.","Решения по курсу команда принимала на данных: 6 гипотез, анкета и интервью вместо ощущений.","Кураторы работают по единым правилам: понятно, кто за что отвечает, как проверять работы и как вести практики."],link:{href:"https://madscourses.com/",label:"madscourses.com"}},{id:"sketch",n:"09",cat:"school",color:"olive",headline:"Аудит школы авторского скетчинга: 5 зон риска, 4 аватара аудитории и стратегия переупаковки",project:"Аудит и стратегия для школы авторского скетчинга",meta:["проект под NDA","в команде с методологом","аудит и стратегия"],metrics:[{v:"3",label:"продукта линейки прошли аудит"},{v:"5",label:"зон риска нашли в программах"},{v:"4",label:"аватара аудитории с болями и мотивами"}],role:"Методолог в паре с коллегой-методологом: аудит программ, исследование аудитории, рекомендации и стратегия развития.",context:"У школы сильное академическое ядро — база от профессора архитектуры с 46-летним стажем, авторский метод и лояльное сообщество. При этом курсы выглядели как «склад видеолекций», а новые студенты приходили в основном по рекомендациям.",did:["Провели аудит трёх продуктов линейки: двух ступеней основного курса и модуля по композиции. Для каждого описали ключевую особенность и потенциал развития.","Выделили 6 образовательных активов школы, на которых можно строить рост: авторский язык, методики, экспертный статус, академическое ядро, сообщество и мастерскую.","Нашли 5 зон риска: информационная изоляция, несшитые модули, скрытые барьеры, размытое позиционирование и непрозрачный тайминг.","Собрали 4 аватара аудитории — от практикующих архитекторов до творческих искателей — с болями, потребностями и мотивами, и карту трансформации студента на курсе.","Предложили стратегию: упростить и реструктурировать программы, оцифровать авторский метод, конкретизировать тайминги и результаты, построить сообщество и переехать на удобную платформу."],effect:["Основатели получили карту роста: что менять в курсах и как привлекать студентов не только по рекомендациям.","Основатели забрали стратегию себе, но по их решению проект не дошёл до реализации."]},{id:"rzd",n:"10",cat:"media",color:"pink",headline:"Молодёжь читает историю БАМа: +30% подписчиков 18–25 лет за четыре месяца",project:"Edutainment-проект о Байкало-Амурской магистрали для «РЖД»",meta:["агентство «СКОТЧ»","история","март 2022 — март 2024"],metrics:[{v:"+30%",label:"к доле подписчиков 18–25 лет за четыре месяца"},{v:"500+",label:"уникальных материалов во «ВКонтакте» и «Одноклассниках»"},{v:"4 000+",label:"человек посмотрели контент и взаимодействовали с ним"}],role:"Образовательная концепция, исследование, стратегия и координация команды.",context:"К 50-летию БАМа «РЖД» запустили «БАМ-50» — документальный историко-культурный проект о магистрали и людях, которые её строили. Для человека младше 25 лет БАМ звучит как параграф из учебника, а в соцсетях за его внимание борются развлекательные паблики.",did:["Провела глубинные интервью, разобрала конкурентов и архивные материалы.","Сместила фокус с подвигов на повседневность: как жили строители, что ели, какие песни пели, какие байки ходили по вагонам.","Собрала концепцию на стыке научной базы и сторителлинга, а тон проекта оформила как методическую основу для медиа.","Координировала тексты, сценарии, фотоархивы и работу с «ТАСС»."],effect:["Аудитория проекта помолодела: доля подписчиков 18–25 лет выросла на 30% за четыре месяца.","У медиа появилась база для долгосрочного развития — тон и принципы подачи.","Проект продолжает жить: у портала «БАМ-50» больше 305 000 уникальных пользователей, а посетители добавили в архив больше 2 700 биографий строителей."],link:{href:"https://bam50.ru/",label:"bam50.ru"}},{id:"story",n:"11",cat:"media",color:"orange",headline:"Кросс-медийный продукт к книге о семейной истории: 46 материалов, 10+ спикеров и редполитика с нуля",project:"Медиа «История тебя» для «Проекта Жизнь»",meta:["в штате","история и генеалогия","январь 2021 — февраль 2022"],metrics:[{v:"46",label:"материалов вышло в медиа"},{v:"10+",label:"спикеров — историков и генеалогов"},{v:"4",label:"человека в команде, которой я руководила"}],role:"Главный редактор медиа: концепция, редполитика, команда и спикеры. Какое-то время вела весь контент сама.",context:"«Проект Жизнь» помогает людям восстановить историю своей семьи и выпускает об этом книгу. Компании нужно было медиа, которое продолжает книгу и при этом работает как самостоятельный продукт.",did:["Придумала кросс-медийный продукт: медиа дополняет книгу и живёт отдельно от неё на нескольких площадках.","Исследовала тему, собрала структуру сайта и разделов, написала редполитику: миссию, тон, правила подачи и проверки фактов.","Привлекла больше 10 спикеров — историков и генеалогов — и выстроила с ними работу.","Разработала систему производства, на которой компания экономила и сокращала бюджеты на разработку контента.","Руководила командой из 4 человек, а какое-то время сама вела весь контент медиа.","Вела информационную поддержку фестиваля генеалогии и семейной истории «Гентех», выступала с лекцией на «Красноярской летней школе» как главред медиа."],effect:["Медиа вышло на стабильный выпуск: 46 материалов в ленте.","Контент обходился компании дешевле благодаря моей системе производства.","Редполитику и стратегию компания использует после моего ухода."],link:{href:"https://xn--90ahia3amfid3kd.xn--p1ai/media",label:"историятебя.рф"}},{id:"series",n:"12",cat:"media",color:"pine",headline:"Из архивов — в сценарии: исследование и фактура для федерального edutainment-сериала",project:"Федеральный edutainment-сериал креативной студии",meta:["проект под NDA","история","декабрь 2020 — июль 2021"],metrics:[],role:"Исследователь проекта: отвечала за исследование, архивы и точность фактов в сериале, книгах и буклетах студии.",context:"Сериал рассказывает об истории широкой аудитории на федеральном уровне. Ошибку в факте увидят миллионы, поэтому каждый факт должен быть точным, а подача — понятной зрителю без исторического образования.",did:["Собрала исследование и фактуру, на которых строились сценарии сериала.","Переводила сложный исследовательский материал в истории, понятные массовому зрителю.","Работала с архивными источниками для книг и буклетов студии: искала, систематизировала, проверяла каждый факт.","Сформулировала принципы отбора материала под сценарные форматы, по которым студия выбирала, что попадает в эпизод."],effect:["Сценарии, книги и буклеты студии опираются на проверенные источники.","Сценаристы получали готовую фактуру и не тратили время на поиск и проверку.","Отбор материала под форматы шёл по понятным правилам, а не на вкус."]},{id:"pages",n:"13",cat:"media",color:"olive",headline:"7 наград Red Dot и золото Epica Awards для мультимедийного историко-культурного проекта",project:"Мультимедийный историко-культурный проект креативной медиалаборатории",meta:["проект под NDA","история и архивы","январь — июль 2020"],metrics:[{v:"5",label:"платформ: Twitter, Instagram, Facebook, «ВКонтакте», YouTube"},{v:"7",label:"наград Red Dot Design Award, две из них высшие"},{v:"6 мес.",label:"вела Twitter проекта"}],role:"Младший продюсер образовательных проектов в команде студии: рисёрч, верификация данных, сценарии, ведение Twitter.",context:"Проект рассказывал молодой аудитории историю через язык современных медиа: архивные документы и личные воспоминания переносили в пять соцсетей, у каждой свой формат. Публикаций тысячи, и каждый факт нужно было проверить.",did:["Выстроила процесс работы с архивными материалами и верифицировала данные перед публикацией.","Полгода вела Twitter проекта: собирала историческую хронику в формате постов очевидцев.","Писала сценарии роликов для YouTube, в том числе по зарубежным архивам.","Придумывала интерактивные форматы для роликов и строила сторителлинг на документах и личных историях.","Исследовала предметные области и брала интервью у экспертов.","Готовила проверенную фактуру для иллюстраторов, моушен-дизайнеров и студентов дизайн-школы, которые делали графику проекта."],effect:["Проект получил 7 наград Red Dot Design Award, две из них высшие.","Золото Epica Awards в категории Social Networks и шорт-лист Cannes Lions в Digital Craft за сторителлинг на нескольких платформах.","Две бронзы Clio Entertainment за социальный контент и серебро Cresta Awards за инновационное использование соцсетей.","Вовлечённость аудитории превысила KPI вдвое."]}],Dm={CustDev:"Разговариваю с будущими студентами до того, как начать делать курс. Узнаю, что им на самом деле нужно, чтобы не учить лишнему.","CJM студента":"Карта того, как человек проходит курс от первого клика до последнего урока. По ней видно, где ему скучно или сложно и где он может бросить.","Backward Design":"Планирую курс с конца. Сначала решаю, что человек должен уметь после обучения, а потом подбираю уроки, которые к этому ведут.",ADDIE:"Пошаговый план создания курса: изучить задачу, придумать, сделать, запустить, проверить. С ним ничего не теряется по дороге.","4C/ID":"Способ учить сложным навыкам на настоящих задачах. Человек сразу решает задачи из жизни, от простых к сложным, а теорию получает тогда, когда она нужна.","таксономия Блума":"Лестница целей обучения: от «запомнить» до «придумать своё». По ней понятно, чего ждать от студента и какие задания ему давать.",андрагогика:"Наука о том, как учатся взрослые. Взрослым важно понимать, зачем им это, и сразу применять знания в жизни.",скиллмэп:"Карта навыков по уровням: что человек умеет в начале, в середине и в конце. По ней собирают программу и проверяют, чему он научился.","синхронные курсы":"Учатся все вместе и в одно время: живые вебинары, созвоны, общий чат с куратором. Подходит, когда важны обратная связь здесь и сейчас и поддержка группы.","асинхронные курсы":"Каждый проходит курс в своём темпе: записанные уроки, задания и проверки доступны в любое время. Так учатся занятые взрослые, и курс легко масштабировать на тысячи студентов.","диалоговые тренажёры":"Переписка с персонажем, где студент сам выбирает, что ответить. Отрабатывает разговор с клиентом, запрос к нейросети или сложную ситуацию на работе и сразу видит, к чему привёл его выбор.","обучающие боты":"Помощник в мессенджере, который ведёт студента по курсу. Присылает задания, напоминает о дедлайнах, отвечает на частые вопросы и снимает часть нагрузки с кураторов.","метрики обучения":"Цифры, по которым видно, работает ли курс. Смотрю, сколько людей дошли до конца, где бросили, как оценили уроки и справились ли с практикой, и по ним решаю, что поправить.","модель Киркпатрика":"Способ проверить, сработал ли курс. Смотрю на четыре вещи: понравилось ли, запомнили ли, применяют ли на работе и есть ли польза для бизнеса."},Ql={statement:"Сначала выясняю, зачем человек пришёл на курс. От ответа зависит всё остальное: программа, форматы и то, как я проверю результат.",steps:[{verb:"Исследую",items:["конкурентный анализ","CustDev","глубинные интервью","CJM студента","качественные исследования","количественные исследования"]},{verb:"Проектирую",items:["программы целиком","скиллмэп","Backward Design","ADDIE","4C/ID","таксономия Блума","андрагогика"]},{verb:"Собираю",items:["синхронные курсы","асинхронные курсы","мини-курсы","интерактивные лонгриды","диалоговые тренажёры","обучающие игры","квизы и тесты","дипломные проекты","кастомные платформы","ИИ-ассистенты","обучающие боты"]},{verb:"Измеряю",items:["модель Киркпатрика","доходимость","оценки","вовлечение","метрики обучения"]}],tools:["Claude Code","Claude","ChatGPT","Gemini","Nano Banana","NotebookLM","Manus","n8n","Figma","FigJam/Miro","Notion","Canva","Tilda","GetCourse","iSpring","Articulate Storyline","LMS"]},EC="Работаю в штате и беру проекты: целиком или по частям, разово или надолго. Стоимость называю после созвона, когда понятны объём и сроки.",Ps=[{name:"Методолог в вашу команду",text:"Выхожу в штат, на частичную или проектную занятость. Беру на себя методологию линейки, экспертов и производство курсов.",includes:["полный цикл: от программы до сборки на платформе","работа с экспертами и подрядчиками","метрики: доходимость, оценки, конверсия"],time:"штат или проект"},{name:"Консультация",text:"Созвон, на котором разбираем ваш продукт, программу или методологию. Подходит, если вопрос решается за пару часов.",includes:["разбор курса, программы или идеи","ответы на вопросы команды","список следующих шагов"],time:"1,5–2 часа"},{name:"Методологический аудит",text:"Разбираю, как устроено обучение в курсе, где студенты теряются и что делают конкуренты.",includes:["путь студента и места, где он бросает","логика программы и заданий","сравнение с конкурентами","план правок по приоритету"],time:"1–2 недели"},{name:"Программа и скиллмэп",text:"Проектирую программу целиком: от карты навыков до заданий и системы оценивания. Так я собрала для курса креаторов mads карту компетенций на три уровня и результаты по модулям.",includes:["скиллмэп — навыки по уровням","результаты обучения по модулям","задания и оценивание","ТЗ для спикеров и экспертов"],time:"по объёму"},{name:"Пересборка готового контента",text:"Есть лекции, вебинары или старый курс? Пересоберу их в новый продукт без пересъёмок — быстрее и дешевле, чем делать с нуля.",includes:["аудит того, что уже есть","новая структура и путь студента","практика и задания поверх записей","конспекты и лонгриды"],time:"дешевле, чем с нуля"},{name:"Тренажёры, игры и боты",text:"Собираю интерактив сама в Claude Code, без очереди к разработчику.",includes:["диалоговые тренажёры","обучающие игры и квизы","боты и ИИ-ассистенты"],time:"от 4 часов на тренажёр"},{name:"Курс с нуля",text:"Делаю курс вместе с командой методологов и подрядчиков — от исследования до первого потока.",includes:["исследование рынка и аудитории","программа, сценарии, материалы","съёмка, монтаж, платформа","сопровождение первого потока"],time:"от 3 месяцев"},{name:"Свой случай",text:"Опишите ситуацию в сообщении, и я предложу формат под задачу.",includes:[],time:"обсудим"}],bC=[{text:"Нина — специалист своего дела, системная, крутая, идейная. Делали вместе с ней курс, брали также сопровождение на потоке — это специалист, на которого можно положиться. Спасибо большое за совместную работу! Буду обращаться сам и рекомендовать другим.",name:"Александр Батин",role:"руководитель отдела продаж в EdTech"},{text:"Я очень благодарна Нине — её фидбек на программу и лабораторию как раз дал понимание, что есть вещи, которые нужно раскрыть для понимания формата. Многие вещи я сама не увидела! Так что взгляд и мнение человека вне — золото просто!",name:"Елена Дернова",role:"креативный директор, основатель Looch AI и лаборатории AI Sparta"},{text:"В программе много пользы и много креатива. У Нины есть и структура, и вкус, поэтому учиться по такой программе интересно.",name:"Senior Learning Experience Designer",role:"edtech-проект под NDA"}],Bn={hello:"Рада познакомиться!",p1:"Меня зовут Нина. С 2020 года я делаю обучающие проекты: сначала в креативных студиях и медиа, теперь в edtech.",p2:"Курс для меня — продукт, у которого есть пользователь со своей задачей.",p3Before:"По образованию я историк, окончила «Вышку» — это неожиданно пригодилось в методологии. Академическая среда научила меня разбирать гору разрозненных источников и собирать из них ",p3Mark:"связный",p3After:" учебный материал.",path:[{years:"2020–2021",title:"Прихожу в образовательный продакшен",text:["С января по июль 2020 года в креативной медиалаборатории исследую предметные области, беру интервью у экспертов и превращаю сырой материал в структуру для edutainment-роликов. Выстраиваю работу с архивами для мультимедийного историко-культурного проекта, полгода веду его Twitter и пишу сценарии роликов для YouTube. Проект получил 7 наград Red Dot и золото Epica.","С декабря 2020 по июль 2021 года в креативной студии собираю исследование и фактуру для федерального edutainment-сериала."]},{years:"2021–2022",title:"Запускаю медиа с нуля",text:["С января 2021 по февраль 2022 года в «Проекте Жизнь» запускаю медиа о семейной истории «История тебя»: исследование, структура, миссия и тон. Руковожу командой из 4 человек, выпускаем 46 материалов с 10+ спикерами."]},{years:"2022–2024",title:"Совмещаю креатив и образование",text:["С марта 2022 по март 2024 года в агентстве «СКОТЧ» делаю образовательные спецпроекты для «РЖД» и «Банка России». Стажируюсь в двух агентствах и получаю юниорские награды D&AD и Young Lions.","Прохожу «Профессию Методист» и «Проектирование цифровых образовательных продуктов» в «РУДН» и полностью ухожу в методологию."]},{years:"2024–2025",title:"Работаю с крупными клиентами и массовыми курсами",text:["В мае 2024 года прихожу в Академию «Эдюсон» и разрабатываю курсы по нейросетям, маркетингу и дизайну. В 2025 году занимаю первое место в отделе по объёму выпуска и становлюсь сотрудником года. Средняя оценка моих материалов — 4,8.","Участвую в исследовании ИИ-аватаров и вместе с коллегами встраиваю их в производство курсов.","С февраля 2024 года параллельно беру фриланс: тренажёры для «Яндекс Образования», методология школы mads, лаборатория AI Sparta, курсы под ключ для независимых экспертов."]},{years:"2026",title:"Повышаю квалификацию в продукте и ИИ",text:["Лидирую помодульную разработку контента в «Эдюсоне», в том числе по ведущим ИИ-экосистемам. Вместе с продуктом перевели курсы по нейросетям с лонгридов на тренажёры: тренажёр теперь собирается за 4–5 часов, как лонгрид, а не за 8–12. Мои 4 механики взял весь кластер методологов, а 5 скиллов для Claude Code, которые я собрала, упростили работу всего кластера.","Учусь продуктовой разработке: проверять гипотезы, проводить исследования и работать с метриками. Сразу применяю это в курсах — от CustDev до разбора доходимости.","Беру новые форматы и ниши: мини-курсы по «Алисе AI» и Qwen, скиллмэпы, программы по архитектуре, скетчингу, психологии и кино."]}]},Om={title:"Давайте поработаем вместе",text:"Расскажите о задаче или пригласите в команду. Отвечу, смогу ли помочь и в каком формате."},Lm={title:"Что будет после вашего сообщения",steps:[{lead:"Вы пишете.",text:"В Telegram или на почту: что нужно и к какому сроку. Кнопки с задачами выше скопируют начало сообщения."},{lead:"Созваниваемся.",text:"Разбираем задачу и что у вас уже есть, обсуждаем сроки и бюджет."},{lead:"Присылаю предложение.",text:"Презентация с этапами, сроками и стоимостью. Её удобно переслать руководителю."},{lead:"Согласовываем.",text:"Обсуждаем предложение, при необходимости двигаем сроки и объём. Стартуем, когда всё устраивает обе стороны."},{lead:"Работаем по этапам.",text:"После каждого этапа показываю результат и собираю правки. Если что-то меняется, сразу обсуждаем, как это скажется на сроках."}]},AC=[{label:"Методолог в команду",text:"Здравствуйте, Нина! Ищем методолога в команду: "},{label:"Консультация",text:"Здравствуйте, Нина! Хочу консультацию: "},{label:"Аудит курса",text:"Здравствуйте, Нина! Хочу методологический аудит курса: "},{label:"Программа или скиллмэп",text:"Здравствуйте, Нина! Нужна программа или скиллмэп: "},{label:"Пересборка курса",text:"Здравствуйте, Нина! Хочу пересобрать готовый контент: "},{label:"Тренажёр, игра или бот",text:"Здравствуйте, Нина! Нужен интерактив: "},{label:"Курс с нуля",text:"Здравствуйте, Нина! Хочу сделать курс с нуля: "},{label:"Другое",text:"Здравствуйте, Нина! У меня задача: "}],ct={kicker:"Методолог образовательных программ",name:"Нина Волкова",format:"Удалённо, гибрид · штат, частичная или проектная занятость",summary:"Методолог онлайн-курсов с продуктовым подходом. 6+ лет в образовательных проектах, из них 2,5 года в «Эдюсоне» — EdTech-платформе из топ-10 России. Сделала 740+ учебных и медиаматериалов: массовые асинхронные курсы, интерактивные тренажёры, корпоративные спецпроекты и курсы под ключ для экспертов. В среднем 75% участников доходят до конца моих курсов. Начинаю с задачи студента и данных, веду команды методистов, экспертов и подрядчиков, собираю тренажёры в Claude Code за 4–5 часов вместо 8–12.",stats:[{v:"75%",t:"участников в среднем доходят до конца моих курсов"},{v:"195",t:"учебных материалов и 178 часов контента в «Эдюсоне»"},{v:"4,8/5",t:"так студенты оценивают мои материалы"},{v:"№ 1",t:"в отделе по объёму выпуска, «Эдюсон», 2025"}],expTitle:"Опыт работы · 6 лет 6 месяцев",jobs:[{title:"Аналитик-методолог",org:"Академия «Эдюсон»",when:"Май 2024 — сейчас",long:"2 года 6 мес.",sub:"Топ-10 EdTech России · асинхронные курсы для рескиллеров и апскиллеров · eduson.academy",text:"Лидирую помодульную разработку контента линейки «Нейросети», в том числе по ведущим ИИ-экосистемам. Линейка — среди лидеров по выручке в своём кластере. В команде контента 33 человека, из них 19 методологов.",bullets:["Выпустила 195 учебных материалов и 178 часов контента, половину — без привлечения эксперта.","В 2025 году заняла 1-е место в отделе по объёму выпуска и стала сотрудником года.","Держу среднюю оценку материалов 4,8/5.","Вместе с продуктом перевели курсы по нейросетям с лонгридов на тренажёры: сборка тренажёра — 4–5 часов вместо 8–12. Собрала 10 демо-тренажёров по «Алисе AI», Qwen и «Шедевруму».","Собрала 5 скиллов для Claude Code и внедрила 4 образовательные механики. Ими пользуется весь кластер методологов.","Сделала контент курса, после которого 78,7% студентов выбирают тариф «ПРО».","Профессиональный тест как лид-магнит привёл 50+ студентов без бюджета на рекламу.","Вела 20+ экспертов, до 6 одновременно."],stack:"Claude Code, Claude, ChatGPT, NotebookLM, Articulate Storyline, Figma, Notion"},{title:"Методолог-продуктолог",org:"фриланс",when:"Февраль 2024 — сейчас",long:"2 года 9 мес.",sub:"EdTech-компании, онлайн-школы и независимые эксперты",text:"Беру проекты под ключ: курсы с нуля, методологический аудит, пересборку программ и консультации. Собираю и веду команды методистов и подрядчиков.",bullets:["«Яндекс Образование»: в команде адаптировали продукт про ИИ для школ Казахстана — 7 интерактивных тренажёров для 5 аудиторий. Отвечала за механики и методички для учителей и родителей.","Курс «Продажи: для работы, карьеры и жизни» под ключ как лид проекта: бюджет, подрядчики, методист в команде, исследование, программа, съёмки, авторский гайдбук. 86% студентов активно учились в первый месяц.","Лаборатория AI Sparta: пересобрала программу и базу знаний. 12 из 12 участников дошли до конца, 40% программы передали приглашённым спикерам.","Онлайн-школа психологии (NDA): за 3 месяца — продуктовая линейка, регламенты кураторов, база знаний для 3 флагманских программ, 4 новых модуля по 5 уроков.","Креативная школа mads: исследование курса «Бренд-стратегия» — 6 гипотез, анкета и интервью — и 8 регламентов для отдела кураторов.","Школа авторского скетчинга (NDA): в паре с методологом провели аудит 3 продуктов и собрали стратегию переупаковки."],stack:"Claude Code, Claude, ChatGPT, Manus, NotebookLM, Figma, Notion"},{title:"Креатор образовательных проектов",org:"агентство «СКОТЧ»",when:"Март 2022 — март 2024",long:"2 года 1 мес.",sub:"Креативное агентство · образовательные и медиапроекты для корпоративных заказчиков",text:"Делала образовательные спецпроекты для «РЖД» и «Банка России»: концепция, исследование, стратегия, координация команды.",bullets:["Edutainment-проект «РЖД» о БАМе: 500+ материалов во «ВКонтакте» и «Одноклассниках», 4 000+ человек взаимодействовали с контентом.","Доля подписчиков 18–25 лет выросла на 30% за 4 месяца.","Провела глубинные интервью и конкурентный анализ, оформила тон проекта как методическую основу для медиа.","Координировала тексты, сценарии, фотоархивы и работу с «ТАСС».","Образовательный контент для «Банка России» (под NDA)."]},{title:"Главный редактор медиа",org:"«Проект Жизнь»",when:"Январь 2021 — февраль 2022",long:"1 год 2 мес.",sub:"Медиа о семейной истории «История тебя»",text:"Запустила кросс-медийный продукт к книге о семейной истории: медиа дополняет книгу и работает отдельно от неё.",bullets:["46 материалов в медиа, 10+ спикеров — историков и генеалогов.","Написала редполитику: миссию, тон, правила подачи и проверки фактов. Компания пользуется ей после моего ухода.","Разработала систему производства, на которой компания сокращала бюджеты на контент.","Руководила командой из 4 человек, какое-то время вела весь контент сама.","Вела информационную поддержку фестиваля генеалогии и семейной истории «Гентех»."]},{title:"Рисёрчер",org:"креативная студия (NDA)",when:"Декабрь 2020 — июль 2021",long:"8 мес.",sub:"Федеральный edutainment-сериал",bullets:["Собирала исследование и фактуру для сценариев сериала, переводила сложный материал в истории для массового зрителя.","Работала с архивами для книг и буклетов студии: поиск, систематизация, фактчекинг.","Сформулировала принципы отбора материала под сценарные форматы."]},{title:"Младший продюсер образовательных проектов",org:"креативная медиалаборатория (NDA)",when:"Январь — июль 2020",long:"7 мес.",sub:"Мультимедийный историко-культурный проект",bullets:["Выстроила процесс работы с архивами и проверяла данные перед публикацией.","Полгода вела Twitter проекта, писала сценарии роликов для YouTube, придумывала интерактивные форматы.","Проект получил 7 наград Red Dot, золото Epica Awards и шорт-лист Cannes Lions."]}],skills:["Learning Experience Design","Методология обучения","Backward Design","ADDIE","Таксономия Блума","Андрагогика","CustDev и JTBD","Глубинные интервью","CJM студента","Метрики обучения","Аудит образовательных продуктов","Скиллмэпы","Регламенты кураторов","Распаковка экспертов","Управление командой и подрядчиками","Claude Code","Articulate Storyline","iSpring","Figma","Miro","Notion","LMS"],education:[{t:"НИУ ВШЭ",s:"Бакалавр, история · 2022"},{t:"Проектирование цифровых образовательных продуктов",s:"РУДН · 2023"},{t:"Профессия Методист",s:"IZIBIZI · 2023"},{t:"Концептуальное мышление",s:"mads · 2023"},{t:"Методист образовательных программ",s:"«Эдюсон» · 2024"},{t:"Нейросети для образования",s:"«Эдюсон» · 2026"}],languages:["Русский — родной","Английский — B2","Немецкий — A2"],awards:["Сотрудник года, «Эдюсон», 2025","Юниорские награды D&AD и Young Lions"]};function TC(e,t){const n=C.createContext(t),r=i=>{const{children:o,...a}=i,l=C.useMemo(()=>a,Object.values(a));return d.jsx(n.Provider,{value:l,children:o})};r.displayName=e+"Provider";function s(i){const o=C.useContext(n);if(o)return o;if(t!==void 0)return t;throw new Error(`\`${i}\` must be used within \`${e}\``)}return[r,s]}function Ga(e,t=[]){let n=[];function
